# F51 Darwin-X 100M — Full organism lineage.
# Fresh-start only. All structural organs enabled from init.
# Calibrated by gradient contribution, not loss value.
model_name: F51-Darwin-X-100M
init: random
tokenizer: f51_bpe
vocab_size: 58162
context_length: 5120
inference_context_length: 32768
d_model: 512
n_layers: 12
n_heads: 8
n_kv_heads: 2
ssd_attention_ratio: "3:1"
dropout: 0.0
rope_base_train: 10000.0
rope_base_infer: 100000.0
residual_scale_multiplier: 1.2
ssm_expand: 2
ssm_state: 16

fine_experts: 32
shared_experts: 2
experts_per_token: 8
fine_expert_hidden_dim: 128
shared_expert_hidden_dim: 512

# ── Auxiliary loss weights (Tier 3 starting points) ──
mtp_depth: 2
mtp_weight: 0.15
jepa_weight: 0.05
jepa_dist_weight: 1.0
jepa_temporal_mask_ratio: 0.50  # JEPA masking: 50% masked, rompe correlacao trivial
ghost_weight: 0.07
ghost_mask_ratio: 0.15
ghost_enabled: true
curiosity_weight: 0.0          # requires code integration — field defined, not consumed
spider_sense_enabled: true
spider_calibration_enabled: true
spider_calibration_weight: 0.02
aux_loss_scale: 1.0
aux_loss_adaptive: true

# ── Heartbeat ──
heartbeat_enabled: true
heartbeat_think_interval: 1
heartbeat_explore_interval: 10
heartbeat_memory_capacity: 1024
heartbeat_surprise_threshold: 0.3
heartbeat_ff_layers: 2

# ── TTM Residual ──
ttm_residual_enabled: true
ttm_residual_max_scale: 0.15
ttm_associative_weight: 0.02
# Endereçamento por entidade (Stage 1, 2026-07-27): marca posicoes salientes
# via Spider-Sense, escreve/le memoria por posicao, injeta esparso -- ver
# heartbeat.py/model.py. Fresh-start V3 e a primeira linhagem real com isso.
ttm_entity_addressing: true
ttm_entity_top_k: 4

# ── Performance (Tier 0) ──
nitro_enabled: false            # P0.2: CPU↔GPU ping-pong durante treino
nitro_gpu_expert_capacity: 8
gradient_checkpointing: true

# ── DAE ──
dae_enabled: true
dae_shadow_mode: false
loss_semantics_version: 2     # required by ttm_residual + spider_calibration
scan_chunk_size: 128
qkv_bias: true
vertical_routing_scale: 0.1

# ── Structural organs ──
gaba_enabled: true
inter_hemispheric_enabled: true
sleep_enabled: true
decision_engine_enabled: true
unified_mesh_enabled: true

legacy_tiers: 7
checkpoint_root: "workspace/03_CHECKPOINTS_100M_FULL_ORGANISM_V3"

module_states:
  - candidate
  - active
  - frozen
  - quarantine
  - merged
  - dead

# ── Blockchain & Senate (append-only; not consuming) ──
blockchain_enabled: true
blockchain_path: workspace/03_CHECKPOINTS_100M_FULL_ORGANISM_V3/blocks.jsonl
senate_enabled: false
senate_interval: 500
senate_min_weight: 0.02
senate_death_threshold: 0.05
senate_rising_bonus: 0.10
senate_newborn_period: 3
