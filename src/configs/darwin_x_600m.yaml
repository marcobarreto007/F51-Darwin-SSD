model_name: F51-Darwin-X-600M
init: random
tokenizer: f51_bpe
vocab_size: 58162
context_length: 4096
inference_context_length: 32768
d_model: 1408
n_layers: 12
n_heads: 16
n_kv_heads: 4
ssd_attention_ratio: "3:1"
dropout: 0.0
rope_base_train: 10000.0
rope_base_infer: 1000000.0
residual_scale_multiplier: 1.4
ssm_expand: 2
ssm_state: 64

# Darwin-X local growth contract: small enough to iterate, same organs as 4B.
# estimate_darwin_x_parameters reports 452,269,384 total params and
# 296,454,400 active params/token. Runtime instantiation is approximately
# 490.2M parameters; this is the checkpoint-compatible local half-billion model.
fine_experts: 6
shared_experts: 1
experts_per_token: 2
fine_expert_hidden_dim: 768
shared_expert_hidden_dim: 768

mtp_depth: 2
mtp_weight: 0.15
jepa_weight: 0.05
ghost_weight: 0.07
ghost_mask_ratio: 0.15
ghost_enabled: true
curiosity_weight: 0.02
spider_sense_enabled: true
aux_loss_scale: 1.0
aux_loss_adaptive: true

# ── Heartbeat ──
heartbeat_enabled: false
heartbeat_think_interval: 1
heartbeat_explore_interval: 10
heartbeat_memory_capacity: 1024
heartbeat_surprise_threshold: 0.3
heartbeat_ff_layers: 3

# ── Nitro ──
nitro_enabled: true
nitro_gpu_expert_capacity: 8

# ── DAE / Evolution ──
dae_enabled: true
dae_shadow_mode: false
loss_semantics_version: 1
scan_chunk_size: 512
qkv_bias: true
vertical_routing_scale: 0.1
spider_calibration_enabled: false
spider_calibration_weight: 0.0
ttm_residual_enabled: false
ttm_residual_max_scale: 0.15

# ── Órgãos integrados (toggles) ──
gaba_enabled: true
inter_hemispheric_enabled: false
sleep_enabled: false
decision_engine_enabled: true
unified_mesh_enabled: true

legacy_tiers: 7

# ── Checkpoint isolation ──
checkpoint_root: "workspace/03_CHECKPOINTS_600M"

module_states:
  - candidate
  - active
  - frozen
  - quarantine
  - merged
  - dead
