name: source-audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-source-audit:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hash-locked audit environment
        run: python -m pip install --require-hashes -r requirements-cpu-audit-dev.lock
      - name: Bootstrap pinned Gitleaks
        shell: pwsh
        run: |
          $url = 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip'
          $expected = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Gitleaks archive hash mismatch: $actual" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          $exe = Join-Path $dir 'gitleaks.exe'
          if ((& $exe version).Trim() -ne '8.30.1') { throw 'Unexpected Gitleaks version' }
          "GITLEAKS_EXE=$exe" >> $env:GITHUB_ENV
      - name: Prepare complete reachable Git ref set
        shell: pwsh
        run: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: GOLD source audit harness
        shell: pwsh
        run: |
          & ./src/tools/run_gold_source_audit.ps1 `
            -PythonExe (Get-Command python).Source `
            -OutputPath governance/audit/generated/gold-source-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-generated
          path: governance/audit/generated/
          if-no-files-found: ignore

