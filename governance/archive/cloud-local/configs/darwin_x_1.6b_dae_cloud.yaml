model_name: F51-Darwin-X-1.6B-DAE-Cloud
init: random
tokenizer: f51_bpe
vocab_size: 58162
context_length: 4096
inference_context_length: 32768
d_model: 1920
n_layers: 16
n_heads: 16
n_kv_heads: 4
ssd_attention_ratio: "3:1"
dropout: 0.0
rope_base_train: 10000.0
rope_base_infer: 1000000.0
residual_scale_multiplier: 1.4
ssm_expand: 2
ssm_state: 16

fine_experts: 14
shared_experts: 2
experts_per_token: 2
fine_expert_hidden_dim: 896
shared_expert_hidden_dim: 896

mtp_depth: 2
mtp_weight: 0.15
jepa_weight: 0.05
ghost_weight: 0.07
ghost_mask_ratio: 0.15
ghost_enabled: true
curiosity_weight: 0.02
spider_sense_enabled: true
aux_loss_scale: 1.0
aux_loss_adaptive: true

heartbeat_enabled: true
heartbeat_think_interval: 1
heartbeat_explore_interval: 10
heartbeat_memory_capacity: 1024
heartbeat_surprise_threshold: 0.3
heartbeat_ff_layers: 3

legacy_tiers: 7
nitro_enabled: false
nitro_gpu_expert_capacity: 14

dae_enabled: true
dae_shadow_mode: false
dae_update_gain_min: 0.75
dae_update_gain_max: 1.25

module_states:
  - candidate
  - active
  - frozen
  - quarantine
  - merged
  - dead
